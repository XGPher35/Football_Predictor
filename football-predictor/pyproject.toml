[project]
name = "neural-network-notebooks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "matplotlib-inline==0.2.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "rich>=13.9.0",
    "scikit-learn>=1.7.2",
    "torch",
    "torchvision>=0.20.1",
    "tqdm>=4.67.3",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
